name: Validate pull request

on:
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Run tests
        run: npm test

      - name: Audit production dependencies (report only)
        run: npm audit --omit=dev --audit-level=high || true

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install browser testing tools in an isolated directory
        run: |
          mkdir -p "$RUNNER_TEMP/hygge-browser"
          printf '{"name":"hygge-browser","private":true,"type":"module"}' > "$RUNNER_TEMP/hygge-browser/package.json"
          npm install --prefix "$RUNNER_TEMP/hygge-browser" --no-audit --no-fund playwright
          "$RUNNER_TEMP/hygge-browser/node_modules/.bin/playwright" install --with-deps chromium
      - name: Browser smoke test
        run: |
          cp scripts/browser-smoke.mjs "$RUNNER_TEMP/hygge-browser/smoke.mjs"
          node "$RUNNER_TEMP/hygge-browser/smoke.mjs"
